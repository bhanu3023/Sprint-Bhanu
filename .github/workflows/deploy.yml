name: Deploy to production

# Manual only, on purpose. Twelve schema migrations run when the container boots,
# so a deploy is a database event as much as a code one and wants a human behind it.
# Run it from Actions -> "Deploy to production" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''

concurrency:
  # Never let two deploys touch the server at once.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Type DEPLOY in the confirm box to run this."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Syntax gate
        # The project rule: never ship without these passing (see CLAUDE.md).
        run: |
          node --check server.js
          node --check app.js
          for f in lib/*.js lib/migrations/index.js; do node --check "$f"; done
          echo "syntax OK"

      # Tracked files only. Extracting this over the deploy directory leaves
      # untracked files alone, which is how the server's .env and uploads/ survive
      # a deploy -- and .env matters because the Dockerfile has no .dockerignore,
      # so `COPY . .` bakes it into the image.
      - name: Build the release archive
        run: |
          git archive --format=tar HEAD | gzip -9 > /tmp/release.tar.gz
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          ls -lh /tmp/release.tar.gz

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload the release
        run: |
          scp -i ~/.ssh/id_deploy -P "${{ secrets.SSH_PORT }}" \
            /tmp/release.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/release.tar.gz"

      - name: Back up the database
        # Before anything is replaced. A deploy runs migrations; this dump is the
        # only way back. An empty or failed dump stops the deploy.
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -euo pipefail -s' <<'REMOTE'
            STAMP=$(date +%Y%m%d-%H%M%S)
            mkdir -p /opt/backups
            OUT="/opt/backups/sprintboard-${STAMP}.sql"
            docker exec sprint-postgres pg_dump -U postgres sprintboard > "$OUT"
            SIZE=$(stat -c%s "$OUT")
            echo "backup: $OUT (${SIZE} bytes)"
            if [ "$SIZE" -lt 1024 ]; then
              echo "Backup looks empty -- refusing to deploy." >&2
              exit 1
            fi
            # Keep the last 10 so /opt/backups cannot fill the disk.
            ls -1t /opt/backups/sprintboard-*.sql | tail -n +11 | xargs -r rm --
          REMOTE

      - name: Deploy and restart
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -euo pipefail -s' <<'REMOTE'
            cd /opt/Sprint-Board

            # Keep the running image so a bad deploy can be rolled back to it.
            if docker image inspect sprint-board-app >/dev/null 2>&1; then
              docker tag sprint-board-app sprint-board-app:previous
              echo "tagged current image as sprint-board-app:previous"
            fi

            # Overlay tracked files. No rm -rf: .env and uploads/ are untracked and
            # must survive, and .env is what the image build picks up.
            tar -xzf /tmp/release.tar.gz -C /opt/Sprint-Board
            rm -f /tmp/release.tar.gz
            test -f /opt/Sprint-Board/.env || { echo ".env missing after extract -- aborting" >&2; exit 1; }

            docker stop sprint-board-app || true
            docker rm   sprint-board-app || true
            docker build -t sprint-board-app .
            docker run -d --name sprint-board-app \
              -p 8082:3000 \
              --restart unless-stopped \
              --network sprint-net \
              --init \
              sprint-board-app

            echo "--- migration output ---"
            sleep 12
            docker logs sprint-board-app 2>&1 | grep -Ei 'migrate|schema|Listening|error' | tail -30
          REMOTE

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://sprintboard.cftools.live || echo 000)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "::error::Site did not return 200 after the deploy."
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'docker logs --tail 60 sprint-board-app 2>&1' || true
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "- commit: \`${{ env.commit }}\`"
            echo "- target: /opt/Sprint-Board on ${{ secrets.SSH_HOST }}"
            echo "- health: https://sprintboard.cftools.live"
            echo ""
            echo "Rollback: \`docker stop sprint-board-app && docker rm sprint-board-app &&"
            echo "docker run -d --name sprint-board-app -p 8082:3000 --restart unless-stopped"
            echo "--network sprint-net --init sprint-board-app:previous\`"
            echo ""
            echo "Database restore: \`docker exec -i sprint-postgres psql -U postgres sprintboard <"
            echo "/opt/backups/<newest>.sql\`"
          } >> "$GITHUB_STEP_SUMMARY"
