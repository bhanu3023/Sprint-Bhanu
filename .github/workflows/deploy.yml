name: Deploy to production

# Automatic on every push to main. A manual "Run workflow" button is also kept
# for re-running the current commit without a new push (e.g. after fixing a
# server-side issue that had nothing to do with the code).
#
# Safety net: container rollback (seconds). The previous working image is
# tagged :previous before anything is touched. If the new image fails to
# build, or the app fails its health check after starting, that old image is
# put back immediately. This never touches git or GitHub -- a failed deploy
# leaves production on the last known-good image, and the broken commit
# stays on main for a human to fix and push again.
#
# NOT covered: a database migration that partially applied before the failure.
# Rolling back code does not undo a schema change. That is a judgement call
# for a human -- see the job summary on a failed run.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Syntax gate
        # The project rule: never ship without these passing (see CLAUDE.md).
        # Fails before anything touches the server -- nothing to roll back here.
        #
        # This used to be `node --check server.js` + `node --check app.js`. The
        # structural refactor split app.js into src/client/ (42 files) and moved
        # server.js's body into src/server/ (36 files), leaving root server.js as
        # require-only glue. app.js stopped existing, so `node --check app.js`
        # failed on every push -- the gate was checking a deleted file instead of
        # the code that replaced it. Both trees are walked here so the coverage
        # matches what the two original checks actually covered.
        #
        # Root .js is globbed rather than naming server.js alone. That covers the
        # entry point AND the two root client scripts index.html loads directly,
        # hotjar.js and combination-options.js, which neither the original gate
        # nor its first replacement checked -- a syntax error in either shipped
        # clean. Globbing means a new root script is covered the day it lands.
        #
        # MINIMUM COUNTS, not just non-zero. A non-zero guard fires at 0 files;
        # it does nothing at 79 of 89. That gap is reachable: this repo lives in
        # a OneDrive folder with Files On-Demand, and mid-session 16 harness
        # files plus src/client/bootstrap.js were dehydrated out of the working
        # tree. A missing file passes `node --check` by never being checked, so
        # a truncated tree would sail through and ship.
        #
        # Update these numbers DELIBERATELY when files are added or removed.
        # A mismatch is meant to make you look, not to be silenced.
        run: |
          MIN_ROOT_JS=3      # server.js, hotjar.js, combination-options.js
          MIN_SRC_JS=79      # src/client 42 + src/server 37
          MIN_LIB_JS=6       # lib/*.js, excluding lib/migrations/index.js

          ROOT_JS=$(find . -maxdepth 1 -type f -name '*.js' | sort)
          ROOT_N=$(printf '%s\n' "$ROOT_JS" | grep -c .)
          SRC_N=$(find src/client src/server -type f -name '*.js' | wc -l)
          LIB_N=$(find lib -maxdepth 1 -type f -name '*.js' | wc -l)
          echo "root=$ROOT_N (min $MIN_ROOT_JS)  src=$SRC_N (min $MIN_SRC_JS)  lib=$LIB_N (min $MIN_LIB_JS)"

          if [ "$ROOT_N" -lt "$MIN_ROOT_JS" ] || [ "$SRC_N" -lt "$MIN_SRC_JS" ] || [ "$LIB_N" -lt "$MIN_LIB_JS" ]; then
            echo "::error::Syntax gate found FEWER files than expected (root $ROOT_N/$MIN_ROOT_JS, src $SRC_N/$MIN_SRC_JS, lib $LIB_N/$MIN_LIB_JS). The tree is truncated or the expected counts are stale -- do not ship until you know which." >&2
            exit 1
          fi

          printf '%s\n' "$ROOT_JS" | xargs -r -n1 node --check
          find src/client src/server -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          for f in lib/*.js lib/migrations/index.js; do node --check "$f"; done
          echo "syntax OK"

      # Tracked files only. Extracting this over the deploy directory leaves
      # untracked files alone, which is how the server's .env and uploads/
      # survive a deploy. `COPY . .` then bakes .env into the image, and it must
      # be there to bake in -- so .env is deliberately NOT in .dockerignore.
      # (.dockerignore does exclude node_modules/, .git/, .github/ and
      # .refactor-verify/; see that file for why each one.)
      - name: Build the release archive
        # The archive is what actually ships, so its contents are asserted here
        # rather than trusted. Same reason as the minimum counts in the syntax
        # gate: a tree truncated by OneDrive dehydration would otherwise produce
        # a smaller archive and deploy silently.
        #
        # git archive reads from the commit, not the working tree, so it is
        # already immune to a dehydrated file -- this catches the other
        # direction: files accidentally dropped from a commit, or .gitignore /
        # export-ignore changes that quietly stop shipping something.
        #
        # Update MIN_ARCHIVE_ENTRIES deliberately when files are added/removed.
        run: |
          MIN_ARCHIVE_ENTRIES=191

          git archive --format=tar HEAD > /tmp/release.tar
          ENTRIES=$(tar -tf /tmp/release.tar | grep -c .)
          echo "archive entries: $ENTRIES (min $MIN_ARCHIVE_ENTRIES)"
          if [ "$ENTRIES" -lt "$MIN_ARCHIVE_ENTRIES" ]; then
            echo "::error::Release archive has $ENTRIES entries, expected at least $MIN_ARCHIVE_ENTRIES. Refusing to ship a possibly-truncated tree." >&2
            exit 1
          fi

          # Entry point and the two trees must be in the archive by name, not
          # just present in the count.
          for required in server.js index.html login.html styles.css package.json; do
            tar -tf /tmp/release.tar | grep -qx "$required" || {
              echo "::error::Release archive is missing $required." >&2; exit 1; }
          done
          ARC_SRC=$(tar -tf /tmp/release.tar | grep -cE '^src/(client|server)/.*\.js$')
          echo "archive src/ js entries: $ARC_SRC"
          if [ "$ARC_SRC" -lt 79 ]; then
            echo "::error::Release archive has only $ARC_SRC src/ js files, expected at least 79." >&2
            exit 1
          fi

          gzip -9 -c /tmp/release.tar > /tmp/release.tar.gz
          rm -f /tmp/release.tar
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          ls -lh /tmp/release.tar.gz

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload the release
        run: |
          scp -i ~/.ssh/id_deploy -P "${{ secrets.SSH_PORT }}" \
            /tmp/release.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/release.tar.gz"

      - name: Back up the database
        # Before anything is replaced. A deploy runs migrations; this dump is
        # the only way back from a schema change. An empty or failed dump
        # stops the deploy before the server is touched at all.
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -euo pipefail -s << 'REMOTE'
          STAMP=$(date +%Y%m%d-%H%M%S)
          mkdir -p /opt/backups
          OUT="/opt/backups/sprintboard-${STAMP}.sql"
          docker exec sprint-postgres pg_dump -U postgres sprintboard > "$OUT"
          SIZE=$(stat -c%s "$OUT")
          echo "backup: $OUT (${SIZE} bytes)"
          if [ "$SIZE" -lt 1024 ]; then
            echo "Backup looks empty -- refusing to deploy." >&2
            exit 1
          fi
          ls -1t /opt/backups/sprintboard-*.sql | tail -n +11 | xargs -r rm --
          REMOTE

      - name: Build and deploy
        id: deploy
        # Build BEFORE touching the running container. If the build fails, the
        # currently-running container is never stopped -- production is simply
        # untouched, and the rollback step (below) has nothing to do. Only once
        # the new image builds successfully do we tag the old one :previous and swap.
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -euo pipefail -s << 'REMOTE'
          cd /opt/Sprint-Board
          rm -f /opt/Sprint-Board/.deploy-swapped

          tar -xzf /tmp/release.tar.gz -C /opt/Sprint-Board
          rm -f /tmp/release.tar.gz
          test -f /opt/Sprint-Board/.env || { echo ".env missing after extract -- aborting" >&2; exit 1; }

          docker build -t sprint-board-app:staging .

          if docker image inspect sprint-board-app >/dev/null 2>&1; then
            docker tag sprint-board-app sprint-board-app:previous
          fi
          docker tag sprint-board-app:staging sprint-board-app
          docker stop sprint-board-app || true
          docker rm   sprint-board-app || true
          docker run -d --name sprint-board-app \
            -p 8082:3000 \
            --restart unless-stopped \
            --network sprint-net \
            --init \
            sprint-board-app

          touch /opt/Sprint-Board/.deploy-swapped

          echo "--- migration output ---"
          sleep 12
          docker logs sprint-board-app 2>&1 | grep -Ei 'migrate|schema|Listening|error' | tail -30
          REMOTE

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://sprintboard.cftools.live || echo 000)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "::error::Site did not return 200 after the deploy."
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'docker logs --tail 60 sprint-board-app 2>&1' || true
          exit 1

      # -- Container rollback ---------------------------------------------
      # Runs whenever ANYTHING above failed. Only actually swaps the container
      # back if the deploy step got far enough to swap it in the first place
      # (the .deploy-swapped marker) -- a syntax-gate or build failure never
      # touched the running container, so there is nothing to undo here.
      # This is the only automatic recovery -- the broken commit itself is
      # left on main for a human to fix and push again.
      - name: Roll back the container if the deploy failed
        if: failure()
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s << 'REMOTE'
          if [ ! -f /opt/Sprint-Board/.deploy-swapped ]; then
            echo "Container was never swapped for this attempt -- nothing to roll back."
            exit 0
          fi
          rm -f /opt/Sprint-Board/.deploy-swapped
          if ! docker image inspect sprint-board-app:previous >/dev/null 2>&1; then
            echo "::warning::No :previous image exists -- cannot auto-rollback the container. Production may be down; check manually."
            exit 0
          fi
          echo "Rolling back to the previous working image..."
          docker stop sprint-board-app || true
          docker rm   sprint-board-app || true
          docker run -d --name sprint-board-app \
            -p 8082:3000 \
            --restart unless-stopped \
            --network sprint-net \
            --init \
            sprint-board-app:previous
          echo "rolled back"
          REMOTE

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "- commit: \`${{ env.commit }}\`"
            echo "- target: /opt/Sprint-Board on ${{ secrets.SSH_HOST }}"
            echo "- health: https://sprintboard.cftools.live"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "**This deploy failed.** What should have happened automatically:"
              echo "- the previous container image was restarted (if the deploy got that far)"
              echo ""
              echo "The broken commit is still on main. Fix it locally, then push again --"
              echo "the same pipeline will auto-deploy once it passes."
              echo ""
              echo "If the container rollback did not happen (check the step above), roll back by hand:"
              echo '```'
              echo "docker stop sprint-board-app && docker rm sprint-board-app &&"
              echo "docker run -d --name sprint-board-app -p 8082:3000 --restart unless-stopped"
              echo "--network sprint-net --init sprint-board-app:previous"
              echo '```'
              echo ""
              echo "Database restore, only if a migration actually corrupted data (check first):"
              echo '```'
              echo "docker exec -i sprint-postgres psql -U postgres sprintboard < /opt/backups/<newest>.sql"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
